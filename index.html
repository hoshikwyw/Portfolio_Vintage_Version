    <!-- Browser UI chrome, matched to whichever theme the OS will resolve to. -->
    <meta name="theme-color" content="#2a2a3e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#dfe3ee" media="(prefers-color-scheme: light)" />

    <!--
      Stamp the saved theme onto <html> before the first paint, so the page
      never flashes the wrong colours while the React bundle loads. This must
      stay inline and synchronous — an external or deferred script would run
      after the browser has already painted.

      The key and the theme names mirror `src/shared/config/theme.js`; change
      the two together.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kayv-theme') || 'system'
          var theme =
            stored === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'classic'
              : stored
          // `classic` is what bare :root renders, so it carries no attribute.
          if (theme !== 'classic') {
            document.documentElement.setAttribute('data-theme', theme)
          }
        } catch (e) {
          // Blocked storage or no matchMedia — the default theme already applies.
        }
      })()
    </script>

    <!--
      Warm up the two third-party origins the desktop hits on load: Supabase
      (projects + gallery) and OpenWeather (taskbar tray). Both are reached
      from JS after hydration, so opening the TCP/TLS connection now removes a
      round trip from the first request. `crossorigin` is required for the
      preconnect to be reused by the CORS fetches that follow.
    -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://api.openweathermap.org" crossorigin />
    <link rel="dns-prefetch" href="https://api.openweathermap.org" />
